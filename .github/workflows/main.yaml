# Scans the AWS Terraform files (terraform/aws) for security problems.
# Save as: .github/workflows/terraform-scan.yml

name: Terraform Security Scan

on:
  push:
    branches: [main]
    paths:
      - 'terraform/aws/**'          # only run when AWS files change
  pull_request:
    branches: [main]
    paths:
      - 'terraform/aws/**'
  workflow_dispatch:

jobs:

  # =========================================================
  # JOB 1: Checkov
  # =========================================================
  checkov:
    name: Scan with Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: checkov -d terraform/aws --framework terraform --compact --quiet
        #                   ^^^^^^^^^^^^^ only the AWS folder

  # =========================================================
  # JOB 2: Trivy
  # =========================================================
  trivy:
    name: Scan with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      # Installing the binary directly instead of using trivy-action.
      # The action's version tags were compromised in a March 2026
      # supply-chain attack, so we avoid that dependency entirely.
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Run Trivy
        run: trivy config terraform/aws --severity CRITICAL,HIGH --exit-code 1
        #                  ^^^^^^^^^^^^^ only the AWS folder

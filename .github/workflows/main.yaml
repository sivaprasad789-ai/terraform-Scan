# This workflow scans your Terraform files for security problems.
# It runs automatically whenever code is pushed to the main branch.
#
# Save this file as: .github/workflows/terraform-scan.yml

name: Terraform Security Scan

# WHEN should this run?
on:
  push:
    branches: [main]        # every push to main
  pull_request:
    branches: [main]        # every pull request into main
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:

  # =========================================================
  # JOB 1: Checkov
  # =========================================================
  checkov:
    name: Scan with Checkov
    runs-on: ubuntu-latest

    steps:
      # Download your code onto the build machine
      - name: Get the code
        uses: actions/checkout@v4

      # Run Checkov against your Terraform files
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform      # <-- change to your Terraform folder
          framework: terraform
          soft_fail: false          # false = fail the build if problems found

  # =========================================================
  # JOB 2: Trivy
  # =========================================================
  trivy:
    name: Scan with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: terraform       # <-- change to your Terraform folder
          severity: CRITICAL,HIGH   # only care about serious problems
          exit-code: '1'            # 1 = fail the build if problems found
